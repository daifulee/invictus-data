name: INVICTUS Backfill

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days to backfill"
        required: true
        default: "90"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "curl_cffi>=0.7.0" "pandas==2.2.3" "requests==2.32.3" "numpy"
      - name: Run backfill
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python backfill_data.py --days ${{ inputs.days }}
      - name: Commit data
        run: |
          git config user.name "invictus-bot"
          git config user.email "bot@invictus.local"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "backfill: last ${{ inputs.days }} days [skip ci]"
            git push
          fi
