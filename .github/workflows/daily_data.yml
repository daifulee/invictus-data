name: INVICTUS Daily Data

on:
  schedule:
    # 08:05 KST = 23:05 UTC (전날)
    # UTC 일~목 (0-4) = KST 월~금
    - cron: "5 23 * * 0-4"
  workflow_dispatch:  # 수동 실행 허용

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance==0.2.50 pandas==2.2.3 requests==2.32.3

      - name: Run collector
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python daily_data.py

      - name: Commit data
        run: |
          git config user.name "invictus-bot"
          git config user.email "bot@invictus.local"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "daily: $(date -u +%Y-%m-%d) data update [skip ci]"
            git push
          fi
